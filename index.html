<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Comic Home</title>

<style>
  body {
    margin: 0;
    background: url('background2.png') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* Fade overlay */
  body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 0;
  }

  /* Banner container */
  #bannerContainer {
    width: 900px;
    height: 120px;
    margin-top: 10px;
    position: relative;
    z-index: 1;
    overflow: hidden;
    border-radius: 10px;
  }

  #bannerImage {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* Thumbnail wrappers */
  .thumbWrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 20px;
    z-index: 1;
  }

  .thumbButton {
    height: 150px;
    cursor: pointer;
    border: 2px solid white;
    border-radius: 10px;
    transition: transform 0.2s;
  }

  .thumbButton:hover {
    transform: scale(1.1);
  }

  .thumbLabel {
    margin-top: 8px;
    color: white;
    font-size: 18px;
    text-shadow: 1px 1px 3px black;
  }

  /* Thumbnail row */
  #thumbRow {
    display: flex;
    flex-direction: row;
    justify-content: center;
    z-index: 1;
    margin-top: 30px;
  }
</style>
</head>

<body>

<!-- Animated Banner -->
<div id="bannerContainer">
  <img id="bannerImage" src="banner1.png">
</div>

<!-- Thumbnail Row -->
<div id="thumbRow">

  <!-- Revolution Episode 1 -->
  <div class="thumbWrapper">
    <img src="capter1/c1p1.png" class="thumbButton"
         onclick="window.location.href='viewer.html'">
    <div class="thumbLabel">Revolution Episode 1</div>
  </div>

  <!-- Poker Game -->
  <div class="thumbWrapper">
    <img src="cardgameart/cardback.png" class="thumbButton"
         onclick="window.location.href='game1.html'">
    <div class="thumbLabel">Poker Game</div>
  </div>

  <!-- Duel at Sundown -->
  <div class="thumbWrapper">
    <img src="cardgameart/as.png" class="thumbButton"
         onclick="window.location.href='game2.html'">
    <div class="thumbLabel">Duel at Sundown</div>
  </div>

  <!-- NEW: Endless Loop Duel (Dwarf Token) -->
  <div class="thumbWrapper">
    <img src="boardgameart/dwarf token.png" class="thumbButton"
         onclick="window.location.href='game3.html'">
    <div class="thumbLabel">Endless Loop Duel</div>
  </div>

</div>

<script>
  const frames = ["banner1.png", "banner2.png", "banner3.png", "banner4.png"];
  let index = 0;

  setInterval(() => {
    index = (index + 1) % frames.length;
    document.getElementById("bannerImage").src = frames[index];
  }, 400);
</script>

</body>
</html>
