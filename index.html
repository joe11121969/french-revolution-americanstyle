<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Comic Home</title>

<style>
  body {
    margin: 0;
    background: url('background2.png') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* Fade overlay */
  body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.45); /* adjust opacity for stronger or lighter fade */
    z-index: 0;
  }

  .thumbButton {
    height: 150px;
    cursor: pointer;
    border: 2px solid white;
    border-radius: 6px;
    transition: transform 0.2s;
    z-index: 1; /* keeps the button above the fade layer */
  }

  .thumbButton:hover {
    transform: scale(1.1);
  }
</style>
</head>

<body>

<img src="capter1/c1p1.png" class="thumbButton"
     onclick="window.location.href='viewer.html'">

</body>
</html>
