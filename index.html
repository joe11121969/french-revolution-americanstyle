<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Comic Home</title>

<style>
  body {
    margin: 0;
    background: url('background2.png') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* FIX: removes lower black bar */
    align-items: center;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* Fade overlay */
  body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 0;
  }

  /* Banner container */
  #bannerContainer {
    width: 1600px;
    height: 200px;
    margin-top: 0;
    position: relative;
    z-index: 1;
    background: transparent; /* FIX: removes upper black bar */
  }

  #bannerImage {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Thumbnail button */
  .thumbButton {
    height: 150px;
    cursor: pointer;
    border: 2px solid white;
    border-radius: 10px;
    transition: transform 0.2s;
    z-index: 1;
    margin-top: 40px;
  }

  .thumbButton:hover {
    transform: scale(1.1);
  }
</style>
</head>

<body>

<!-- Animated Banner -->
<div id="bannerContainer">
  <img id="bannerImage" src="banner1.png">
</div>

<!-- Thumbnail button -->
<img src="capter1/c1p1.png" class="thumbButton"
     onclick="window.location.href='viewer.html'">

<script>
  const frames = ["banner1.png", "banner2.png", "banner3.png", "banner4.png"];
  let index = 0;

  setInterval(() => {
    index = (index + 1) % frames.length;
    document.getElementById("bannerImage").src = frames[index];
  }, 400);
</script>

</body>
</html>
