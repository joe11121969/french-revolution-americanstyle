<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Comic Home</title>

<style>
  body {
    margin: 0;
    background: url('background2.png') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* Fade overlay */
  body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    z-index: 0;
  }

  /* Banner container */
  #banner {
    position: absolute;
    top: 0;
    width: 100%;
    height: 150px; /* slightly larger for safety */
    overflow: hidden;
    z-index: 2;
  }

  .bannerImage {
    position: absolute;
    width: 100%;
    height: 150px;
    object-fit: cover;
    object-position: center top;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }

  .thumbButton {
    height: 150px;
    cursor: pointer;
    border: 2px solid white;
    border-radius: 6px;
    transition: transform 0.2s;
    z-index: 1;
  }

  .thumbButton:hover {
    transform: scale(1.1);
  }
</style>
</head>

<body>

<!-- Animated banner -->
<div id="banner">
  <img src="banner1.png" class="bannerImage">
  <img src="banner2.png" class="bannerImage">
  <img src="banner3.png" class="bannerImage">
  <img src="banner4.png" class="bannerImage">
</div>

<!-- Thumbnail button -->
<img src="capter1/c1p1.png" class="thumbButton"
     onclick="window.location.href='viewer.html'">

<script>
let index = 0;
const images = document.querySelectorAll('.bannerImage');

function rotateBanner() {
  images.forEach(img => img.style.opacity = 0);
  images[index].style.opacity = 1;
  index = (index + 1) % images.length;
}

rotateBanner();
setInterval(rotateBanner, 2500);
</script>

</body>
</html>
