<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duel at Sundown</title>

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", sans-serif;
    color: white;
    text-align: center;

    /* FULL BACKGROUND */
    background-image: url("cardgameart/cartable.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    height: 100vh;
    overflow: hidden;
  }

  /* GAME UI CONTAINER — positioned on lower table area */
  #gameArea {
    position: absolute;
    bottom: 12%; /* tuned for bottom-third table placement */
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 600px;
    background: rgba(0,0,0,0.45);
    padding: 20px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.2);
  }

  h1 {
    margin-top: 0;
    font-size: 2em;
    text-shadow: 2px 2px 4px black;
  }

  .hpBar {
    margin: 10px 0;
    font-size: 1.2em;
  }

  #log {
    margin-top: 15px;
    min-height: 80px;
    font-size: 1.1em;
    line-height: 1.4em;
  }

  button {
    margin: 10px;
    padding: 12px 25px;
    font-size: 1.1em;
    background: #b33;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    background: #d44;
    transform: scale(1.05);
  }

  button:disabled {
    background: #555;
    transform: none;
    cursor: default;
  }

  /* BACK ARROW */
  #backBtn {
    position: fixed;
    bottom: 30px;
    left: 30px;
    font-size: 32px;
    color: white;
    background: rgba(0,0,0,0.4);
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    z-index: 9999;
    transition: 0.2s;
  }

  #backBtn:hover {
    background: rgba(255,255,255,0.25);
    transform: scale(1.1);
  }
</style>
</head>

<body>

<!-- BACK BUTTON -->
<div id="backBtn" onclick="window.location.href='index.html'">⬅</div>

<div id="gameArea">
  <h1>Duel at Sundown</h1>

  <div class="hpBar" id="playerHP">Your HP: 3</div>
  <div class="hpBar" id="enemyHP">Outlaw HP: 3</div>

  <button id="rollBtn">Roll Dice</button>
  <button id="restartBtn" style="display:none;">Play Again</button>

  <div id="log"></div>
</div>

<script>
let playerHP = 3;
let enemyHP = 3;

const playerHPDiv = document.getElementById("playerHP");
const enemyHPDiv = document.getElementById("enemyHP");
const logDiv = document.getElementById("log");
const rollBtn = document.getElementById("rollBtn");
const restartBtn = document.getElementById("restartBtn");

function updateHP() {
  playerHPDiv.textContent = "Your HP: " + playerHP;
  enemyHPDiv.textContent = "Outlaw HP: " + enemyHP;
}

function log(msg) {
  logDiv.innerHTML = msg;
}

rollBtn.onclick = () => {
  const playerRoll = Math.ceil(Math.random() * 6);
  const enemyRoll = Math.ceil(Math.random() * 6);

  let roundText = `You rolled <b>${playerRoll}</b> — Outlaw rolled <b>${enemyRoll}</b><br>`;

  if (playerRoll > enemyRoll) {
    enemyHP--;
    roundText += "🎯 You hit the outlaw!";
  } else if (enemyRoll > playerRoll) {
    playerHP--;
    roundText += "💥 The outlaw hits you!";
  } else {
    roundText += "🤝 Standoff — no damage.";
  }

  updateHP();
  log(roundText);

  if (playerHP <= 0 || enemyHP <= 0) {
    rollBtn.disabled = true;
    restartBtn.style.display = "inline-block";

    if (playerHP <= 0 && enemyHP <= 0) {
      log("Both duelists fall... It's a draw.");
    } else if (playerHP <= 0) {
      log("💀 The outlaw wins the duel...");
    } else {
      log("🏆 You win! The outlaw is defeated.");
    }
  }
};

restartBtn.onclick = () => {
  playerHP = 3;
  enemyHP = 3;
  updateHP();
  log("");
  rollBtn.disabled = false;
  restartBtn.style.display = "none";
};
</script>

</body>
</html>
