<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Duel at Sundown</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        background: url('cardgameart/cartable.png') no-repeat center center fixed;
        background-size: cover;
        font-family: Georgia, serif;
        color: #fff;
        height: 100vh;
        overflow: hidden;
    }

    /* Back Arrow */
    #backArrow {
        position: absolute;
        bottom: 20px;
        left: 20px;
        font-size: 40px;
        cursor: pointer;
        color: #fff;
        text-shadow: 2px 2px 4px black;
        z-index: 20;
    }

    /* Centered UI on table */
    #gameContainer {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        background: rgba(0, 0, 0, 0.55);
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 0 20px #000;
    }

    h1 {
        margin-top: 0;
        font-size: 36px;
        letter-spacing: 2px;
        text-shadow: 2px 2px 4px black;
    }

    #log {
        height: 220px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.35);
        padding: 10px;
        border-radius: 8px;
        text-align: left;
        font-size: 18px;
        line-height: 1.4;
    }

    button {
        margin-top: 15px;
        padding: 12px 25px;
        font-size: 20px;
        cursor: pointer;
        background: #8b0000;
        color: white;
        border: 2px solid #300;
        border-radius: 6px;
        transition: 0.2s;
    }

    button:hover {
        background: #b30000;
    }
</style>
</head>

<body>

<div id="backArrow" onclick="window.location.href='index.html'">&#8592;</div>

<div id="gameContainer">
    <h1>Duel at Sundown</h1>

    <div id="log"></div>

    <button onclick="playRound()">Roll Dice</button>
</div>

<script>
let playerHP = 3;
let outlawHP = 3;

function rollDie() {
    return Math.floor(Math.random() * 6) + 1;
}

function log(msg) {
    const logBox = document.getElementById("log");
    logBox.innerHTML += msg + "<br>";
    logBox.scrollTop = logBox.scrollHeight;
}

function playRound() {

    // Stop if duel already ended
    if (playerHP <= 0 || outlawHP <= 0) return;

    const playerRoll = rollDie();
    const outlawRoll = rollDie();

    log(`<strong>You rolled:</strong> ${playerRoll}`);
    log(`<strong>Outlaw rolled:</strong> ${outlawRoll}`);

    if (playerRoll > outlawRoll) {
        outlawHP -= 1;
        log(`<span style='color:#6f3;'>You hit the outlaw! -1 HP</span>`);
    } else if (outlawRoll > playerRoll) {
        playerHP -= 1;
        log(`<span style='color:#f66;'>The outlaw hits you! -1 HP</span>`);
    } else {
        log("<em>Both shots miss!</em>");
    }

    log(`<strong>HP:</strong> You ${playerHP} | Outlaw ${outlawHP}`);
    log("<hr>");

    // Check for duel end
    if (playerHP <= 0 || outlawHP <= 0) {
        finalRoll();
    }
}

function finalRoll() {

    log("<strong>FINAL ROLL TO DECIDE THE DUEL!</strong>");

    const playerFinal = rollDie();
    const outlawFinal = rollDie();

    log(`You rolled <strong>${playerFinal}</strong>`);
    log(`Outlaw rolled <strong>${outlawFinal}</strong>`);

    if (playerFinal > outlawFinal) {
        log("<span style='color:#6f3; font-size:22px;'><strong>You win the duel!</strong></span>");
    } else if (outlawFinal > playerFinal) {
        log("<span style='color:#f66; font-size:22px;'><strong>The outlaw wins the duel!</strong></span>");
    } else {
        // Tie breaker by remaining HP
        if (playerHP > outlawHP) {
            log("<strong>It's a tie, but you had more HP — YOU WIN!</strong>");
        } else if (outlawHP > playerHP) {
            log("<strong>It's a tie, but the outlaw had more HP — YOU LOSE!</strong>");
        } else {
            log("<strong>Perfect tie — it's a draw!</strong>");
        }
    }
}
</script>

</body>
</html>
