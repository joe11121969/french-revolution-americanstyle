<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Duel at Sundown</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        background: url('cardgameart/cartable.png') no-repeat center center fixed;
        background-size: cover;
        font-family: Georgia, serif;
        color: #fff;
        height: 100vh;
        overflow: hidden;
    }

    /* CLEARER BACK ARROW */
    #backArrow {
        position: absolute;
        bottom: 20px;
        left: 20px;
        font-size: 48px;
        cursor: pointer;
        color: #ffffff;
        text-shadow: 3px 3px 6px black, 0 0 10px #fff;
        z-index: 20;
        font-weight: bold;
    }

    /* NEW ROUND BUTTON */
    #resetButton {
        position: absolute;
        bottom: 20px;
        right: 20px;
        font-size: 20px;
        padding: 10px 20px;
        background: #004d00;
        color: white;
        border: 2px solid #002800;
        border-radius: 6px;
        cursor: pointer;
        text-shadow: 1px 1px 2px black;
    }

    #resetButton:hover {
        background: #007000;
    }

    /* Centered UI */
    #gameContainer {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        background: rgba(0, 0, 0, 0.55);
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        box-shadow: 0 0 20px #000;
    }

    h1 {
        margin-top: 0;
        font-size: 36px;
        letter-spacing: 2px;
        text-shadow: 2px 2px 4px black;
    }

    /* FIXED STATUS AREA */
    #statusBox {
        height: 160px;
        background: rgba(0, 0, 0, 0.35);
        padding: 10px;
        border-radius: 8px;
        font-size: 20px;
        line-height: 1.4;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    #hpLine {
        font-size: 22px;
        margin-bottom: 10px;
    }

    button {
        margin-top: 15px;
        padding: 12px 25px;
        font-size: 20px;
        cursor: pointer;
        background: #8b0000;
        color: white;
        border: 2px solid #300;
        border-radius: 6px;
        transition: 0.2s;
    }

    button:hover {
        background: #b30000;
    }
</style>
</head>

<body>

<div id="backArrow" onclick="window.location.href='index.html'">&#8592;</div>

<!-- NEW ROUND BUTTON -->
<div id="resetButton" onclick="resetGame()">New Round</div>

<div id="gameContainer">
    <h1>Duel at Sundown</h1>

    <div id="statusBox">
        <div id="hpLine"><strong>HP:</strong> You 3 | Outlaw 3</div>
        <div id="turnText">Click Roll Dice to begin.</div>
    </div>

    <button onclick="playRound()">Roll Dice</button>
</div>

<script>
let playerHP = 3;
let outlawHP = 3;

function rollDie() {
    return Math.floor(Math.random() * 6) + 1;
}

function updateHP() {
    document.getElementById("hpLine").innerHTML =
        `<strong>HP:</strong> You ${playerHP} | Outlaw ${outlawHP}`;
}

function setText(msg) {
    document.getElementById("turnText").innerHTML = msg;
}

function declareWinner() {
    if (playerHP <= 0 && outlawHP > 0) {
        setText(`<span style='color:#f66; font-size:22px;'><strong>The outlaw wins the duel!</strong></span>`);
        return true;
    }
    if (outlawHP <= 0 && playerHP > 0) {
        setText(`<span style='color:#6f3; font-size:22px;'><strong>You win the duel!</strong></span>`);
        return true;
    }
    if (playerHP <= 0 && outlawHP <= 0) {
        setText(`<strong>Both duelists fall — it's a draw!</strong>`);
        return true;
    }
    return false;
}

function playRound() {

    if (playerHP <= 0 || outlawHP <= 0) return;

    const p = rollDie();
    const o = rollDie();

    let text = `<strong>You rolled:</strong> ${p}<br>
                <strong>Outlaw rolled:</strong> ${o}<br>`;

    if (p > o) {
        outlawHP -= 1;
        text += `<span style='color:#6f3;'>You hit the outlaw! -1 HP</span>`;
    } else if (o > p) {
        playerHP -= 1;
        text += `<span style='color:#f66;'>The outlaw hits you! -1 HP</span>`;
    } else {
        text += `<em>Both shots miss!</em>`;
    }

    setText(text);
    updateHP();

    // IMMEDIATE WIN CHECK — NO FINAL ROLL
    declareWinner();
}

/* NEW ROUND RESET */
function resetGame() {
    playerHP = 3;
    outlawHP = 3;
    updateHP();
    setText("New round started. Click Roll Dice.");
}
</script>

</body>
</html>
